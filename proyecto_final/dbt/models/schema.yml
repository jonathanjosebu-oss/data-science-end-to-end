version: 2

sources:
  - name: raw_schema
    schema: RAW
    tables:
      - name: RAW_REPORT_DATA
        description: >-
          Datos crudos de RepoRT cargados por Kestra. Conserva un snapshot por
          SNAPSHOT_DATE (fecha lógica de la carga o del backfill) y el commit de
          RepoRT del que proviene.
        columns:
          - name: SNAPSHOT_DATE
            tests:
              - not_null
          - name: SOURCE_COMMIT
            tests:
              - not_null

models:
  - name: stg_report_data
    description: "Capa Bronze: nombres y tipos estandarizados del snapshot elegido, sin descartar filas"
    columns:
      - name: registro_id
        tests:
          - not_null
          - unique

  - name: int_registros_clasificados
    description: >-
      Capa Silver (auditoría): una fila por registro Bronze con el motivo de
      exclusión aplicado (nulo = se conserva).
    columns:
      - name: registro_id
        tests:
          - not_null
          - unique
      - name: motivo_exclusion
        tests:
          - accepted_values:
              arguments:
                values:
                  - rt_no_positivo
                  - sin_inchikey
                  - no_retenido_rt_menor_igual_t0
                  - rt_fuera_de_rango
                  - replicas_inconsistentes
      - name: flujo_ml_min
        tests:
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: "{{ var('flujo_max_ml_min') }}"
                inclusivo_min: false

  - name: int_retencion_filtrada
    description: >-
      Capa Silver: una observación por (experimento, compuesto); réplicas
      consistentes colapsadas en la mediana.
    columns:
      - name: registro_id
        tests:
          - not_null
          - unique
      - name: tiempo_retencion
        tests:
          - not_null
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: "{{ var('rt_max_min') }}"
                inclusivo_min: false
      - name: rango_replicas_min
        tests:
          - not_null
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: "{{ var('rango_max_replicas_min') }}"
      - name: n_mediciones
        tests:
          - not_null
          - en_rango:
              arguments:
                min_valor: 1
      - name: flujo_ml_min
        tests:
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: "{{ var('flujo_max_ml_min') }}"
                inclusivo_min: false

  - name: dim_metodo
    description: >-
      Capa Gold; grano: una fila por experimento (método). Descriptores
      conocidos antes de inyectar: columna, t0, pH y programa de gradiente.
    columns:
      - name: experimento_id
        tests:
          - not_null
          - unique
      - name: t0_min
        tests:
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: 30
                inclusivo_min: false
      - name: columna_longitud_mm
        # Mínimo 1 mm: el experimento 0008 usa una columna de 5 mm (Hypersil
        # GOLD, t0 = 0,044 min, coherente con su volumen); el primer rango
        # (10 mm) lo marcó como error y se verificó que es real.
        tests:
          - en_rango:
              arguments:
                min_valor: 1
                max_valor: 500
      - name: columna_diametro_mm
        tests:
          - en_rango:
              arguments:
                min_valor: 0.05
                max_valor: 10
      - name: columna_particula_um
        tests:
          - en_rango:
              arguments:
                min_valor: 0.5
                max_valor: 20
      - name: ph_a
        tests:
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: 14
                inclusivo_min: false
      - name: ph_b
        tests:
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: 14
                inclusivo_min: false

  - name: fact_retencion_cromatografica
    description: "Capa Gold; grano: una fila por (experimento, compuesto)"
    columns:
      - name: hecho_id
        tests:
          - not_null
          - unique
      - name: experimento_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_metodo')
                field: experimento_id
      - name: compuesto_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_compuesto')
                field: compuesto_id
      - name: condicion_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_condiciones')
                field: condicion_id
      - name: snapshot_date
        description: "Partición de RAW de la que salió el hecho (linaje)."
        tests:
          - not_null
      - name: source_commit
        description: "Commit de RepoRT de ese snapshot (linaje)."
        tests:
          - not_null
      - name: tiempo_retencion
        tests:
          - not_null
          - en_rango:
              arguments:
                min_valor: 0
                max_valor: "{{ var('rt_max_min') }}"
                inclusivo_min: false

  - name: dim_compuesto
    description: "Dimensión de compuestos; una fila por InChIKey"
    columns:
      - name: compuesto_id
        tests:
          - not_null
          - unique
      - name: inchikey
        tests:
          - not_null
          - unique

  - name: dim_condiciones
    description: "Dimensión de condiciones cromatográficas; una fila por combinación de atributos"
    columns:
      - name: condicion_id
        tests:
          - not_null
          - unique
