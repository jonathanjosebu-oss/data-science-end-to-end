<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="Times New Roman, Times, serif" role="img">
<title>Arquitectura end-to-end QSRR-Predict</title>
<defs><marker id="punta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L10,4 L0,8 z" fill="#52514e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="700" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#c62828">QSRR-Predict · arquitectura end-to-end</text>
<text x="30" y="70" font-size="16" font-weight="bold" fill="#c62828">1 · Datos (PSet 2) — orquestado por Kestra, almacenado en Snowflake</text><line x1="30" y1="78" x2="1370" y2="78" stroke="#e6e5e0" stroke-width="1"/>
<rect x="30" y="95" width="160" height="82" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="110.0" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">RepoRT</text>
<text x="110.0" y="137" text-anchor="middle" font-size="12.5" fill="#52514e">GitHub, TSV por</text>
<text x="110.0" y="153" text-anchor="middle" font-size="12.5" fill="#52514e">experimento</text>
<rect x="225" y="95" width="190" height="82" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="320.0" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Kestra: ingesta</text>
<text x="320.0" y="137" text-anchor="middle" font-size="12.5" fill="#52514e">backfill por snapshot,</text>
<text x="320.0" y="153" text-anchor="middle" font-size="12.5" fill="#52514e">retries, commit fuente</text>
<rect x="450" y="95" width="170" height="82" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="535.0" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Snowflake RAW</text>
<text x="535.0" y="137" text-anchor="middle" font-size="12.5" fill="#52514e">RAW_REPORT_DATA</text>
<text x="535.0" y="153" text-anchor="middle" font-size="12.5" fill="#52514e">partición por fecha</text>
<rect x="655" y="95" width="290" height="82" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="800.0" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">dbt: Bronze → Silver → Gold</text>
<text x="800.0" y="137" text-anchor="middle" font-size="12.5" fill="#52514e">limpieza auditable, 46 pruebas;</text>
<text x="800.0" y="153" text-anchor="middle" font-size="12.5" fill="#52514e">estrella con dim_metodo</text>
<rect x="980" y="95" width="200" height="82" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.6"/>
<text x="1080.0" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Spark: OBT</text>
<text x="1080.0" y="137" text-anchor="middle" font-size="12.5" fill="#52514e">OBT_QSRR_FINAL</text>
<text x="1080.0" y="153" text-anchor="middle" font-size="12.5" fill="#52514e">grano experimento × compuesto</text>
<path d="M 190 136 L 225 136" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 415 136 L 450 136" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 620 136 L 655 136" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 945 136 L 980 136" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<text x="30" y="232" font-size="16" font-weight="bold" fill="#c62828">2 · Modelo (PSet 3) — experimentación y registro</text><line x1="30" y1="240" x2="1370" y2="240" stroke="#e6e5e0" stroke-width="1"/>
<rect x="30" y="257" width="230" height="82" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="145.0" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">EDA y experimentos</text>
<text x="145.0" y="299" text-anchor="middle" font-size="12.5" fill="#52514e">notebooks 01–05, split por</text>
<text x="145.0" y="315" text-anchor="middle" font-size="12.5" fill="#52514e">experimento, GroupKFold</text>
<rect x="295" y="257" width="230" height="82" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="410.0" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">src/pipeline.py</text>
<text x="410.0" y="299" text-anchor="middle" font-size="12.5" fill="#52514e">28 features RDKit + método;</text>
<text x="410.0" y="315" text-anchor="middle" font-size="12.5" fill="#52514e">HistGradientBoosting</text>
<rect x="560" y="257" width="190" height="82" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="655.0" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">MLflow Tracking</text>
<text x="655.0" y="299" text-anchor="middle" font-size="12.5" fill="#52514e">corridas, métricas, tags</text>
<text x="655.0" y="315" text-anchor="middle" font-size="12.5" fill="#52514e">de linaje (OBT, Gold)</text>
<rect x="785" y="257" width="250" height="82" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.6"/>
<text x="910.0" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Model Registry</text>
<text x="910.0" y="299" text-anchor="middle" font-size="12.5" fill="#52514e">qsrr-predict-modelo</text>
<text x="910.0" y="315" text-anchor="middle" font-size="12.5" fill="#52514e">alias @champion / @challenger</text>
<path d="M 1080 177 L 1080 210 L 14 210 L 14 298 L 30 298" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<text x="620" y="204" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">OBT (snapshot con SHA-256)</text>
<path d="M 260 298 L 295 298" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 525 298 L 560 298" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 750 298 L 785 298" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<text x="30" y="410" font-size="16" font-weight="bold" fill="#c62828">3 · Operación (PSet 4)</text><line x1="30" y1="418" x2="1370" y2="418" stroke="#e6e5e0" stroke-width="1"/>
<rect x="30" y="435" width="200" height="82" rx="8" fill="#e8f6f0" stroke="#1a8f63" stroke-width="1.6"/>
<text x="130.0" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">GitHub Actions</text>
<text x="130.0" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">ci.yml: pytest + imagen</text>
<text x="130.0" y="493" text-anchor="middle" font-size="12.5" fill="#52514e">cd.yml: imagen a GHCR</text>
<rect x="265" y="435" width="210" height="82" rx="8" fill="#e8f6f0" stroke="#1a8f63" stroke-width="1.6"/>
<text x="370.0" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">API FastAPI (Docker)</text>
<text x="370.0" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">/salud /modelo /predecir</text>
<text x="370.0" y="493" text-anchor="middle" font-size="12.5" fill="#52514e">respaldo + interruptor</text>
<rect x="510" y="435" width="220" height="82" rx="8" fill="#e8f6f0" stroke="#1a8f63" stroke-width="1.6"/>
<text x="620.0" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Kestra: produccion_lotes</text>
<text x="620.0" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">10 lotes → POST /predecir;</text>
<text x="620.0" y="493" text-anchor="middle" font-size="12.5" fill="#52514e">target llega 1 semana después</text>
<rect x="765" y="435" width="240" height="82" rx="8" fill="#e8f6f0" stroke="#1a8f63" stroke-width="1.6"/>
<text x="885.0" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Snowflake PRODUCCION</text>
<text x="885.0" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">PREDICCIONES · TARGETS</text>
<text x="885.0" y="493" text-anchor="middle" font-size="12.5" fill="#52514e">MONITOREO · ALERTAS</text>
<rect x="1040" y="435" width="200" height="82" rx="8" fill="#e8f6f0" stroke="#1a8f63" stroke-width="1.6"/>
<text x="1140.0" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Tablero Streamlit</text>
<text x="1140.0" y="477" text-anchor="middle" font-size="12.5" fill="#52514e">sistema, modelo, deriva;</text>
<text x="1140.0" y="493" text-anchor="middle" font-size="12.5" fill="#52514e">alertas y reentrenamientos</text>
<rect x="765" y="600" width="240" height="82" rx="8" fill="#e8f6f0" stroke="#1a8f63" stroke-width="1.6"/>
<text x="885.0" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Kestra: monitoreo</text>
<text x="885.0" y="642" text-anchor="middle" font-size="12.5" fill="#52514e">PSI calibrado + KS / chi²,</text>
<text x="885.0" y="658" text-anchor="middle" font-size="12.5" fill="#52514e">RMSE y sesgo por lote</text>
<rect x="1040" y="600" width="300" height="82" rx="8" fill="#fdecec" stroke="#c62828" stroke-width="1.6"/>
<text x="1190.0" y="622" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f1f1f">Kestra: reentrenamiento</text>
<text x="1190.0" y="642" text-anchor="middle" font-size="12.5" fill="#52514e">disparo: caída en 2 lotes seguidos;</text>
<text x="1190.0" y="658" text-anchor="middle" font-size="12.5" fill="#52514e">challenger, regla, PAUSA humana</text>
<path d="M 230 476 L 265 476" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 510 476 L 475 476" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 730 476 L 765 476" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 1005 476 L 1040 476" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 885 517 L 885 600" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<text x="893" y="563" text-anchor="start" font-size="12" font-style="italic" fill="#52514e">cada semana</text>
<path d="M 1005 641 L 1040 641" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<path d="M 1300 600 L 1300 298 L 1035 298" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/>
<text x="1292" y="572" text-anchor="end" font-size="12" font-style="italic" fill="#52514e">aprobado: mueve @champion</text>
<path d="M 910 339 L 910 395 L 430 395 L 430 435" fill="none" stroke="#52514e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#punta)"/>
<text x="670" y="389" text-anchor="middle" font-size="12" font-style="italic" fill="#52514e">carga models:/…@champion (TTL 30 s, sin reconstruir la imagen)</text>
<text x="30" y="740" font-size="12.5" fill="#52514e">Trazabilidad: cada fila de PREDICCIONES guarda versión y run_id; la corrida de MLflow guarda el snapshot de la OBT, su SHA-256, el commit de RepoRT y las tablas Gold.</text>
<text x="30" y="760" font-size="12.5" fill="#52514e">El código se despliega solo (CD); el modelo cambia únicamente cuando una persona aprueba el challenger en la pausa de Kestra.</text>
</svg>
